<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EveryPound</title>
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Zero-based budgeting, no adverts.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192-v2.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-v2.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EveryPound">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: budget ledger on the left, sticky summary ring on the right; on phones the two become tabs with a bottom bar.
   Deliberately light-only: the budget is always shown on a light page. */
:root {
  color-scheme: light;
  --bg: #eef2f0;
  --surface: #ffffff;
  --surface-2: #f5f7f6;
  --ink: #15201c;
  --muted: #5b6a64;
  --line: #dbe3df;
  --track: #e2e8e5;
  --remain: #003561;
  --accent: #0073b9;
  --accent-ink: #ffffff;
  --accent-soft: #e1eef8;
  --brass: #94701f;
  --good: #24a344;
  --good-soft: #e3f6e8;
  --bad: #c2412d;
  --bad-soft: #fbe5e0;
  --g-blue: #00b2f6;
  --g-red: #e64b40;
  --g-amber: #faab19;
  --g-green: #48ce65;
  --g-purple: #b34fa0;
  --g-slate: #6f7f79;
  --shadow: 0 1px 2px rgba(20,40,32,.06), 0 8px 24px rgba(20,40,32,.06);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --radius: 14px;
}
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* Top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 10px;
  border-bottom: 1px solid var(--line); }
.top-in { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-weight: 700; font-size: 17px; letter-spacing: -.01em; }
.brand-mark { width: 28px; height: 28px; border-radius: 50%; background: var(--brass); color: #fff; display: grid; place-items: center; font-size: 15px; font-weight: 700;
  box-shadow: inset 0 0 0 3px #b8963f; }
.sync { font-family: var(--f-body); font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.sync.ok { color: var(--good); }
.sync.warn { color: var(--brass); }
.sync.bad { color: var(--bad); }
.period { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.period-title { text-align: left; min-width: 0; flex: 1; position: relative; }
.period .nav-btns { margin-left: auto; }
.ptitle { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 2px 6px 2px 0; color: var(--ink); cursor: pointer; max-width: 100%; }
.ptitle svg { color: var(--muted); flex: none; transition: transform .15s; }
.ptitle[aria-expanded="true"] svg { transform: rotate(180deg); }
.sync:empty { display: none; }
/* Month picker, like EveryDollar's: a year with twelve months, budgets you have are tappable */
.mpick { position: absolute; top: calc(100% + 8px); left: 0; z-index: 35; background: var(--surface); border-radius: 14px; box-shadow: 0 10px 34px rgba(0,0,0,.18); border: 1px solid var(--line); padding: 12px; width: 300px; max-width: calc(100vw - 32px); }
.mp-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.mp-head b { font-family: var(--f-display); font-size: 18px; }
.mp-head button { border: 0; background: var(--surface-2); width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; padding: 0; }
.mp-head button:disabled { opacity: .3; }
.mp-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.mp-grid button { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 0; font-weight: 600; font-size: 14px; color: var(--ink); }
.mp-grid button:disabled { color: var(--muted); opacity: .45; border-style: dashed; }
.mp-grid button.cur { background: var(--accent); border-color: var(--accent); color: #fff; }
.mp-grid button.now:not(.cur) { border-color: var(--accent); color: var(--accent); }
.mp-note { margin: 10px 2px 0; font-size: 12px; color: var(--muted); }
.period-title h1 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 22px; letter-spacing: -.02em; line-height: 1.1; text-wrap: balance; }
.period-title p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.nav-btns { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.nav-btns button { border: 0; background: none; width: 40px; height: 40px; display: grid; place-items: center; }
.nav-btns button + button { border-left: 1px solid var(--line); }
.nav-btns button:disabled { opacity: .35; cursor: default; }
.plan-next { border: 0; border-radius: 10px; height: 36px; padding: 0 12px; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 14px; white-space: nowrap; }

/* Main grid */
.app { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 24px; align-items: start;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; }
.ledger { display: grid; gap: 16px; min-width: 0; }
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px); display: grid; gap: 16px; min-width: 0; }

.banner { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: var(--radius); background: var(--good-soft); color: var(--ink); font-weight: 600; }
.banner svg { flex: none; color: var(--good); }
.banner.warn { background: var(--bad-soft); }
.banner.warn svg { color: var(--bad); }
.banner .warntxt { display: grid; gap: 2px; min-width: 0; flex: 1; }
.banner .fixinc { flex: none; margin-left: auto; padding: 8px 14px; font-size: 14px; }
.banner .warntxt span { font-weight: 400; font-size: 14px; color: var(--muted); }
.banner small { font-weight: 400; color: var(--muted); margin-left: auto; text-align: right; }

/* Groups */
.group { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.g-head { display: grid; grid-template-columns: minmax(0,1fr) 96px 96px; align-items: center; gap: 8px; padding: 14px 18px 8px; }
.g-title { display: flex; align-items: center; gap: 2px; min-width: 0; }
.g-more { border: 0; background: none; color: var(--muted); width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; flex: none; padding: 0; opacity: .75; }
.g-more:hover { background: var(--surface-2); opacity: 1; }
.g-more svg { display: block; }
.rembanner { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 12px 16px; border: 0; border-radius: var(--radius); background: var(--accent-soft); color: var(--ink); font-weight: 600; font-size: 15px; }
.rembanner svg { color: var(--accent); flex: none; }
.rembanner span { flex: 1; min-width: 0; }
.rembanner b { color: var(--accent); }
.remcard { padding: 0; }
.remlink { display: flex; align-items: center; gap: 10px; width: 100%; padding: 14px 18px; border: 0; background: none; font-weight: 600; font-size: 15px; text-align: left; color: var(--ink); }
.remlink span:first-child { flex: 1; }
.remlink svg { color: var(--muted); }
.remlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.remrow { display: grid; gap: 10px; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--surface); }
.remrow small { display: block; color: var(--muted); font-size: 13px; }
.remrow.done { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--surface-2); }
.remrow.tap { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; text-align: left; font: inherit; color: inherit; cursor: pointer; }
.remrow.tap .amt { font-weight: 600; color: var(--accent); }
.addgroup { border: 1.5px dashed var(--line); background: none; border-radius: var(--radius); padding: 14px; color: var(--accent); font-weight: 600; font-size: 15px; }
.addgroup:hover { background: var(--surface); }
.g-toggle { display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 0; text-align: left; min-width: 0; }
.g-toggle h2 { margin: 0; font-family: var(--f-display); font-size: 16px; font-weight: 700; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.g-toggle .chev { color: var(--muted); transition: transform .15s; flex: none; }
.g-toggle[aria-expanded="false"] .chev { transform: rotate(-90deg); }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.col-h { text-align: right; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.g-note { margin: 0 18px 6px; font-size: 12.5px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.g-note::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--brass); flex: none; }
.lines { list-style: none; margin: 0; padding: 0 8px; }

/* One budget line: a sliding inner row over a red delete button (revealed by swiping right on touch screens) */
.row { position: relative; border-radius: 10px; overflow: hidden; }
.swipe-paid { position: absolute; inset: 0 0 0 auto; width: 84px; border: 0; background: var(--good); color: #fff; display: grid; place-items: center; gap: 2px;
  font-size: 12px; font-weight: 600; align-content: center; }
.swipe-del { position: absolute; inset: 0 auto 0 0; width: 84px; border: 0; background: var(--bad); color: #fff; display: grid; place-items: center; gap: 2px;
  font-size: 12px; font-weight: 600; align-content: center; }
.row-in { position: relative; z-index: 1; background: var(--surface); display: grid; gap: 4px 8px; align-items: center; padding: 10px 10px 12px;
  grid-template-columns: minmax(0,1fr) 96px 96px; grid-template-areas: "name plan val" "bar bar bar"; cursor: pointer; touch-action: pan-y;
  transition: transform .18s ease, padding .15s ease; }
.row.dragging .row-in { transition: none; }
.row.swiped-del .row-in { transform: translateX(84px); }
.row.swiped-paid .row-in { transform: translateX(-84px); }
.paidtick { font-style: normal; color: var(--good); font-weight: 700; margin-right: 4px; }
.row-in:hover { background: var(--surface-2); }
/* Desktop: resting on a row for a moment slides in the bin on the left and Paid on the right
   (the same sides as the phone swipes); nothing takes up space until then */
.bin, .tick { display: none; position: absolute; top: 50%; transform: translateY(-50%); z-index: 2; border: 0; background: none; color: var(--muted);
  width: 28px; height: 28px; border-radius: 8px; place-items: center; padding: 0; opacity: 0; pointer-events: none; transition: opacity .15s ease; }
.bin { left: 6px; }
.tick { right: 6px; }
.tick:hover { color: var(--good); background: var(--good-soft); }
.bin:hover { color: var(--bad); background: var(--bad-soft); }
@media (hover: hover) and (pointer: fine) {
  .bin, .tick { display: grid; }
  .row.hovering .row-in { padding-left: 40px; padding-right: 40px; }
  .row.hovering .bin, .row.hovering .tick, .bin:focus-visible, .tick:focus-visible { opacity: 1; pointer-events: auto; }
  .swipe-del, .swipe-paid { display: none; }
}
.l-name { grid-area: name; min-width: 0; border: 0; background: none; padding: 0; text-align: left; cursor: text; }
.l-name small.warnline, .l-name small .short { color: var(--bad); font-weight: 600; }
.l-name small .ok { color: var(--accent); font-weight: 600; }
.l-val { border: 0; background: none; padding: 0; cursor: pointer; }
.l-name > span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.l-name small { display: block; font-size: 12px; color: var(--muted); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.l-name small b { color: var(--brass); font-weight: 600; }
.l-name small .owe { color: var(--bad); font-weight: 600; }
.l-name small .clear { color: var(--accent); font-weight: 600; }
.l-plan { grid-area: plan; justify-self: end; text-align: right; color: var(--accent); font-weight: 600; border: 0; background: none; padding: 4px 6px; margin-right: -6px;
  border-radius: 8px; border-bottom: 1px dashed transparent; }
.l-plan:hover { background: var(--accent-soft); }
.l-val { grid-area: val; text-align: right; font-weight: 600; }
.l-val.over { color: var(--bad); }
.bar { grid-area: bar; height: 4px; background: var(--track); border-radius: 4px; overflow: hidden; display: flex; justify-content: flex-end; }
.bar i { display: block; height: 100%; background: var(--remain); border-radius: 4px; transition: width .3s ease; }
.inline-in { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid var(--accent); border-radius: 8px; background: var(--surface); box-shadow: 0 0 0 3px var(--accent-soft); min-width: 0; }
.l-plan-in { grid-area: plan; text-align: right; }
.l-name-in { grid-area: name; }
.row.adding .row-in { cursor: default; background: var(--surface-2); }
.g-foot { display: grid; grid-template-columns: minmax(0,1fr) 96px 96px; gap: 8px; align-items: center; padding: 8px 18px 14px; border-top: 1px solid var(--line); margin-top: 4px; }
.g-foot b { text-align: right; font-weight: 700; }
.linkbtn { border: 0; background: none; padding: 12px 0; margin: -8px 0; color: var(--accent); font-weight: 600; font-size: 14px; justify-self: start; }
.group.collapsed .lines, .group.collapsed .g-note { display: none; }
/* Income is counted as received on day 1, so it has no remaining column or bar; Planned stays aligned with the other groups */
.group.income .l-val, .group.income .g-foot b { visibility: hidden; }
.group.income .bar, .group.income .g-head .col-h { display: none; }
/* Income is one or two lines: keep the card compact */
.group.income .g-head { grid-template-areas: "title title title"; row-gap: 0; padding-bottom: 2px; }
.group.income .row-in { row-gap: 0; padding-block: 6px 8px; }
.group.income .g-foot { padding-block: 2px 8px; }
/* The red/green swipe buttons stay hidden until a swipe starts (stops them peeking round the row corners) */
.swipe-del, .swipe-paid { visibility: hidden; }
.row.dragging .swipe-del, .row.dragging .swipe-paid, .row.swiped-del .swipe-del, .row.swiped-paid .swipe-paid { visibility: visible; }
.empty-g { padding: 6px 18px 8px; color: var(--muted); font-size: 14px; margin: 0; }

/* Summary card */
.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; }
.card h3 { margin: 0 0 12px; font-family: var(--f-display); font-size: 16px; letter-spacing: -.01em; }
.seg { display: flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { flex: 1; border: 0; background: none; padding: 9px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.ring-wrap { position: relative; width: min(220px, 70vw); aspect-ratio: 1; max-width: 100%; margin: 6px auto 14px; }
.ring-wrap svg { width: 100%; height: 100%; display: block; }
.ring-wrap circle { transition: stroke-dasharray .4s ease, stroke-dashoffset .4s ease; }
.ring-centre { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring-centre span { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.ring-centre strong { font-family: var(--f-display); font-size: 30px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
.ring-centre strong small { font-size: 16px; color: var(--muted); font-weight: 500; }
.ring-centre em { font-style: normal; font-size: 12px; color: var(--muted); }
.legend { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.legend li { display: grid; grid-template-columns: 10px minmax(0,1fr) auto 44px; gap: 10px; align-items: center; padding: 10px 2px; border-bottom: 1px solid var(--line); font-size: 14px; }
.legend.nopct li { grid-template-columns: 10px minmax(0,1fr) auto; }
.legend li span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.legend .amt { text-align: right; font-weight: 600; }
.legend .pct { text-align: right; color: var(--muted); font-size: 13px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; margin-top: 14px; }
.stat { background: var(--surface-2); border-radius: 10px; padding: 10px; min-width: 0; }
.stat span { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.stat b { display: block; font-size: 15px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; }
.debts { list-style: none; margin: 0; padding: 0; }
.debts li { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.debts li:last-child { border-bottom: 0; }
.debts .owe { color: var(--bad); font-weight: 600; }
.debts .clear { color: var(--accent); font-weight: 600; }
.recent { list-style: none; margin: 0; padding: 0; }
.recent li { display: grid; grid-template-columns: 46px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.recent li:last-child { border-bottom: 0; }
.recent li.empty { display: block; padding: 4px 0 2px; color: var(--muted); font-size: 14px; line-height: 1.45; }
.datechip { font-size: 11px; text-align: center; line-height: 1.1; color: var(--muted); border: 1px solid var(--line); border-radius: 8px; padding: 4px 0; }
.datechip b { display: block; font-size: 15px; color: var(--ink); }
.recent .who { min-width: 0; }
.recent .who span { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.recent .who small { color: var(--muted); font-size: 12px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.recent .amt { font-weight: 600; text-align: right; }
.amt.in { color: var(--accent); }
.muted { color: var(--muted); }

/* Drawer */
.scrim { position: fixed; inset: 0; background: rgba(10,20,16,.38); z-index: 40; }
.drawer { position: fixed; z-index: 41; top: 0; right: 0; bottom: 0; width: min(440px, 100%); background: var(--surface); box-shadow: -10px 0 40px rgba(0,0,0,.18);
  display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.d-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.d-head .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 600; min-width: 0; }
/* Round icon buttons: icon dead centre in the circle */
.iconbtn svg { display: block; }
.ico-x { display: contents; }
.iconbtn { padding: 0; line-height: 0; }
.iconbtn { border: 0; background: var(--surface-2); width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; margin-left: auto; flex: none; }
.ico-back { display: none; }
.d-head .iconbtn.pencil { margin-left: auto; }
.d-head .iconbtn.pencil + .iconbtn { margin-left: 0; }
@media (min-width: 861px) {
  /* Desktop: a line opens in the right-hand column in place of the summary, with a back arrow */
  .scrim { display: none !important; }
  .drawer { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px); grid-column: 2; grid-row: 1; width: auto; max-height: calc(100vh - 110px);
    border-radius: var(--radius); box-shadow: var(--shadow); padding: 0; overflow: hidden; z-index: 1; }
  body.drawer-open .side { display: none; }
  .d-head .iconbtn { order: -1; margin-left: 0; }
  .d-head .iconbtn.pencil { order: 0; margin-left: auto; }
  .activity-card { display: none; } /* desktop: just the summary in the pinned column */
  .d-head .ico-x { display: none; }
  .d-head .ico-back { display: contents; }
}
.d-body { overflow-y: auto; padding: 18px 20px 28px; display: grid; gap: 18px; align-content: start; flex: 1; }
.d-body h2 { margin: 0; font-family: var(--f-display); font-size: 22px; letter-spacing: -.02em; overflow-wrap: anywhere; }
.d-big { font-family: var(--f-display); font-size: 40px; font-weight: 700; letter-spacing: -.03em; line-height: 1; }
.d-big small { font-family: var(--f-body); font-size: 14px; color: var(--muted); font-weight: 500; letter-spacing: 0; margin-left: 4px; }
.d-big.over { color: var(--bad); }
.d-sub { margin: 6px 0 10px; color: var(--muted); }
/* Line panel header, laid out like EveryDollar: name left, remaining right, spent-of-planned underneath */
.d-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.d-top h2 { flex: 1; min-width: 0; }
.d-rem { text-align: right; flex: none; }
.d-rem span { display: block; font-size: 13px; color: var(--muted); }
.d-rem b { display: block; font-family: var(--f-display); font-size: 22px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; }
.d-rem b.over { color: var(--bad); }
.d-plan { color: var(--accent); font-weight: 600; }
.d-sub b { color: var(--ink); }
.bar.big { height: 8px; }
.balance { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); margin-top: 12px; }
.balance b { font-family: var(--f-display); font-size: 22px; letter-spacing: -.02em; }
.balance b.owe { color: var(--bad); }
.balance b.clear { color: var(--accent); }
.balance span { color: var(--muted); font-size: 13px; }
.panel { border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 10px; }
.panel h3, .d-body h3 { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field label { font-size: 12px; color: var(--muted); font-weight: 600; }
.field input, .field select { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); min-width: 0; }
.field input:focus, .field select:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.field small { color: var(--muted); font-size: 12px; }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }
/* The confirming button always sits on the right, other buttons to its left */
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: flex-end; }
.btn { border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 600; background: var(--accent); color: var(--accent-ink); }
.btn.paidbtn { background: var(--good); color: #fff; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 12px 16px; font-size: 15px; }
.amt-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
/* Refund: the word, then a slide toggle */
.refund-pill { position: relative; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--muted); padding: 8px 4px; cursor: pointer; }
.refund-pill .sw { position: relative; width: 42px; height: 24px; border-radius: 999px; background: var(--track); transition: background .15s ease; flex: none; }
.refund-pill .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .15s ease; }
.refund-pill:has(input:checked) { color: var(--ink); }
.refund-pill:has(input:checked) .sw { background: var(--accent); }
.refund-pill:has(input:checked) .sw::after { transform: translateX(18px); }
.refund-pill:has(input:focus-visible) .sw { outline: 2px solid var(--accent); outline-offset: 2px; }
.refund-pill input { position: absolute; opacity: 0; width: 1px; height: 1px; padding: 0; margin: 0; border: 0; }
.amtrow { display: flex; gap: 8px; align-items: stretch; }
.amtrow > input { flex: 1; text-align: right; }
/* Right-thumb layout: date on the left, amount on the right */
.amtrow .date-chip { order: -1; }
.amtlabel { justify-self: end; }
.date-chip { position: relative; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 12px; min-height: 44px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--surface-2); font-weight: 600; font-size: 14px; white-space: nowrap; cursor: pointer; }
.field .date-chip input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; padding: 0; border: 0; cursor: pointer; }
/* Right-thumb friendly: best suggestion at the far right, the rest running leftwards */
.shopchips { display: flex; flex-wrap: wrap; flex-direction: row-reverse; justify-content: flex-start; gap: 6px; margin-top: 8px; }
.shopchips:empty { display: none; }
.shopchip { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 7px 13px; font-size: 14px; font-weight: 600; cursor: pointer; }
.shopchip:hover { border-color: var(--accent); color: var(--accent); }
.formhead { display: flex; align-items: center; justify-content: flex-end; gap: 12px; }
.formhead .btn { padding: 10px 22px; }
.formhead .refund-pill { margin: 0 4px 0 0; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.btn.ghost { background: var(--surface-2); color: var(--ink); }
.btn.danger-ghost { background: var(--bad-soft); color: var(--bad); }
.err { color: var(--bad); font-size: 13px; margin: 0; }
.txlist { list-style: none; margin: 0; padding: 0; }
.txlist li { display: grid; grid-template-columns: 46px minmax(0,1fr) auto 40px; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.txlist li.planned { color: var(--muted); }
.txlist .who { min-width: 0; }
.txlist .who span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.txlist .who small { display: block; font-size: 12px; color: var(--muted); }
.txlist .del { border: 0; background: none; color: var(--muted); width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center; }
.txlist .del:hover { background: var(--bad-soft); color: var(--bad); }
details.edit summary { cursor: pointer; font-weight: 600; color: var(--accent); list-style: none; }
details.edit summary::-webkit-details-marker { display: none; }
details.edit[open] summary { margin-bottom: 12px; }
/* Collapsed sections are a slim one-line row until tapped */
details.edit:not([open]) { padding: 0; display: block; gap: 0; }
details.edit:not([open]) summary { display: flex; justify-content: space-between; align-items: center; padding: 8px 14px; font-size: 14px; line-height: 1.3; }
details.edit summary::after { content: ""; width: 7px; height: 7px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg); margin: -3px 4px 0 12px; flex: none; }
details.edit summary { display: flex; justify-content: space-between; align-items: center; }
details.edit[open] summary::after { transform: rotate(-135deg); margin-top: 3px; }

/* State screens */
.state { max-width: 520px; margin: 12vh auto; padding-inline: 16px; text-align: center; color: var(--muted); }
.state h2 { color: var(--ink); font-family: var(--f-display); margin: 0 0 6px; }

/* Toast */
/* Messages: a slim one-line bar across 90% of the bottom of the screen */
.toast { position: fixed; left: 5%; right: 5%; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); z-index: 60; background: var(--ink); color: #fff;
  min-height: 44px; box-sizing: border-box; padding: 0 6px 0 16px; border-radius: 10px; font-size: 14px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 12px; }
.toast[hidden] { display: none; }
.toast span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toast button { flex: none; border: 0; background: none; color: #7cc8f5; font-weight: 700; padding: 8px 12px; border-radius: 8px; text-transform: uppercase; letter-spacing: .04em; font-size: 13px; }
.toast button:hover { background: #ffffff14; }

/* Mobile */
.tabbar, .fab { display: none; }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0,1fr); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 96px); }
  .side { position: static; }
  .app[data-tab="budget"] .side { display: none; }
  .app[data-tab="summary"] .ledger, .app[data-tab="activity"] .ledger { display: none; }
  /* Summary tab: ring and debts. Activity tab: just the activity list */
  .app[data-tab="summary"] .activity-card { display: none; }
  .app[data-tab="activity"] .side > .card:not(.activity-card) { display: none; }
  .tabbar { display: grid; grid-template-columns: 1fr 1fr 1fr; position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
  .tabbar[hidden], body.typing .tabbar { display: none; }
  /* Compact one-line header on phones */
  .top { padding-block: 10px 8px; }
  .top-in { flex-wrap: nowrap; gap: 10px; }
  .brand > span:nth-child(2) { display: none; }
  .sync.ok { display: none; }

  .period { margin-left: 0; flex: 1; gap: 8px; }
  .period-title { text-align: left; flex: 1; }
  .period-title h1, .period-title p { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .period-title p { font-size: 12px; }
  .wd { display: none; }
  .nav-btns button { width: 40px; height: 40px; }
  .plan-next { height: 40px; padding: 0 12px; font-size: 13px; }
  .l-name, .l-plan { touch-action: pan-y; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .l-name.pressing, .l-plan.pressing { background: var(--accent-soft); border-radius: 8px; }
  .tabbar button { border: 0; background: none; padding: 10px 0 12px; display: grid; justify-items: center; gap: 2px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .tabbar button[aria-selected="true"] { color: var(--accent); }
  .fab { display: grid; place-items: center; position: fixed; z-index: 26; right: max(16px, calc(env(safe-area-inset-right, 0px) + 16px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 72px);
    width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); box-shadow: 0 6px 20px rgba(0,0,0,.25); }
  .fab[hidden] { display: none; }
  .toast { bottom: calc(env(safe-area-inset-bottom, 0px) + 72px); }
  body.drawer-open .toast, body.typing .toast { bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); }
  .period-title h1 { font-size: 19px; }
  .drawer { width: 100%; }
  /* Phones: the group name gets the whole card width; column headings sit on the line below */
  .g-head { grid-template-areas: "title title title" ". plan val"; row-gap: 6px; }
  .g-title { grid-area: title; }
  .g-toggle h2 { white-space: normal; overflow: visible; text-overflow: clip; overflow-wrap: anywhere; }
  .g-head .col-h:nth-of-type(1) { grid-area: plan; }
  .g-head .col-h:nth-of-type(2) { grid-area: val; }
}
@media (max-width: 480px) {
  .g-head, .g-foot { grid-template-columns: minmax(0,1fr) 84px 84px; }
  .row-in { grid-template-columns: minmax(0,1fr) 84px 84px; }
  .brand > span:nth-child(2) { display: none; }
  .sync.ok { display: none; }
  .fields { grid-template-columns: minmax(0,1fr); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ---------- hosted extras ---------- */
[hidden] { display: none !important; }
.state .btn { margin-top: 18px; font-size: 15px; padding: 12px 20px; display: inline-flex; align-items: center; gap: 10px; }
.state .btn svg { background: #fff; border-radius: 50%; padding: 3px; box-sizing: content-box; }
.state .fine { font-size: 13px; margin-top: 14px; }
.state input[type=file] { display: none; }
.acct { display: grid; gap: 10px; }
.acct .who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.acct .who img, .acct .who .av { width: 32px; height: 32px; border-radius: 50%; flex: none; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; }
.acct .who div { min-width: 0; }
.acct .who strong { display: block; font-size: 14px; }
.acct .who span { display: block; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acct .btnrow .btn { padding: 8px 14px; font-size: 14px; }
.startbox { display: grid; gap: 6px; max-width: 320px; margin: 18px auto 0; text-align: left; }
.startbox label { font-size: 13px; font-weight: 600; color: var(--ink); }
.startbox input { font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); }
.startbox .fine { margin: 2px 0 0; }
.startrow { justify-content: flex-end; flex-wrap: nowrap; max-width: 320px; margin: 18px auto 0; }
.startrow .btn { margin-top: 0; cursor: pointer; }
.demo-bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 74px); z-index: 60; background: #15201c; color: #fff; font-size: 12px; font-weight: 600; padding: 6px 8px 6px 14px; border-radius: 999px; display: flex; gap: 10px; align-items: center; box-shadow: 0 4px 12px #0003; white-space: nowrap; }
.demo-bar a { color: #7cc8f5; text-decoration: none; padding: 2px 8px; }
@media (min-width: 861px) { .demo-bar { bottom: 16px; } }
a.btn { text-decoration: none; display: inline-block; }
</style>

</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="period">
      <div class="period-title"><button class="ptitle" id="pTitleBtn" aria-haspopup="dialog" aria-expanded="false"><h1 id="pTitle">Budget</h1><svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m4 6 4 4 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button><p class="num"><span id="pRange"></span> <span class="sync" id="syncState" role="status" aria-live="polite"></span></p>
        <div class="mpick" id="mpick" role="dialog" aria-label="Pick a budget" hidden></div></div>
      <div class="nav-btns">
        <button id="prevP" aria-label="Previous budget" disabled><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3 5 8l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button id="nextP" aria-label="Next budget" disabled><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="m6 3 5 5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <button id="planNext" class="plan-next" hidden>Plan next</button>
    </div>
  </div>
</header>

<div id="stateScreen" class="state"><h2>Loading your budget</h2><p>Fetching your groups and transactions.</p></div>

<main class="app" id="app" data-tab="budget" hidden>
  <section class="ledger" id="ledger" aria-label="Budget"></section>
  <aside class="side" id="side" aria-label="Summary"></aside>
  <div class="drawer" id="drawer" role="dialog" aria-labelledby="dTitle" hidden></div>
</main>
<datalist id="debtNames"></datalist>

<nav class="tabbar" id="tabbar" aria-label="Views" role="tablist" hidden>
  <button role="tab" data-tab="budget" aria-selected="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Budget</button>
  <button role="tab" data-tab="summary" aria-selected="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="2.5"/><path d="M12 4a8 8 0 0 1 8 8" stroke="currentColor" stroke-width="2.5"/></svg>Summary</button>
  <button role="tab" data-tab="activity" aria-selected="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="5" y="3.5" width="14" height="17" rx="2" stroke="currentColor" stroke-width="2"/><path d="M9 8.5h6M9 12h6M9 15.5h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Activity</button>
</nav>

<div class="scrim" id="scrim" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(() => {
  // ---------- helpers ----------
  const GBP = new Intl.NumberFormat('en-GB', { style: 'currency', currency: 'GBP' });
  const money = p => (p < 0 ? '−' : '') + GBP.format(Math.abs(p || 0) / 100);
  const moneyBig = p => { const s = GBP.format(Math.abs(p || 0) / 100); const i = s.lastIndexOf('.'); return (p < 0 ? '−' : '') + s.slice(0, i) + '<small>' + s.slice(i) + '</small>'; };
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const parseISO = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); };
  const toISO = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const fmtDate = (iso, day) => { const d = parseISO(iso); return (day ? DAYS[d.getDay()] + ' ' : '') + d.getDate() + ' ' + MONTHS[d.getMonth()]; };
  const todayISO = () => toISO(new Date());
  const daysBetween = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 86400000);
  // Bacs (direct debit) non-working days: weekends plus England & Wales bank holidays.
  const BACS_HOLIDAYS = new Set(['2026-12-25', '2026-12-28', '2027-01-01', '2027-03-26', '2027-03-29', '2027-05-03', '2027-05-31', '2027-08-30', '2027-12-27', '2027-12-28']);
  const workingDay = iso => { const d = parseISO(iso); while (d.getDay() === 0 || d.getDay() === 6 || BACS_HOLIDAYS.has(toISO(d))) d.setDate(d.getDate() + 1); return toISO(d); };
  const toPence = s => { const n = parseFloat(String(s).replace(/[£,\s]/g, '')); return Number.isFinite(n) ? Math.round(n * 100) : NaN; };
  const uid = () => Math.random().toString(36).slice(2, 10);
  // Amounts are typed like a till: digits push in from the right, so 1 2 5 0 reads £12.50 and the
  // decimal point is never needed. The first digit typed into an existing amount replaces it.
  const fmtDigits = d => d ? GBP.format(parseInt(d, 10) / 100) : '';
  function moneyInput(el) {
    if (!el || el.dataset.money) return; el.dataset.money = '1';
    el.setAttribute('inputmode', 'numeric'); el.setAttribute('autocomplete', 'off');
    const start = el.value ? toPence(el.value) : NaN;
    let digits = Number.isFinite(start) && start > 0 ? String(start) : '', fresh = !!digits;
    const caretEnd = () => { try { const n = el.value.length; el.setSelectionRange(n, n); } catch {} };
    const show = () => { el.value = fmtDigits(digits); caretEnd(); el.dispatchEvent(new Event('moneychange')); };
    el.value = fmtDigits(digits);
    el.addEventListener('focus', () => { fresh = !!digits; setTimeout(caretEnd, 0); });
    el.addEventListener('pointerup', () => setTimeout(caretEnd, 0));
    el.addEventListener('beforeinput', e => {
      const t = e.inputType || '';
      if (t === 'insertFromPaste' || t === 'insertFromDrop') return;
      if (t.startsWith('insert')) {
        e.preventDefault();
        const d = (e.data || '').replace(/\D/g, ''); if (!d) return;
        digits = ((fresh ? '' : digits) + d).replace(/^0+/, '').slice(0, 9); fresh = false; show();
      } else if (t.startsWith('delete')) {
        e.preventDefault(); digits = fresh ? '' : digits.slice(0, -1); fresh = false; show();
      }
    });
    // Pasted text is read as pounds ("1000" or "£1,000" is £1,000.00)
    el.addEventListener('paste', e => {
      e.preventDefault(); const v = toPence((e.clipboardData || window.clipboardData).getData('text'));
      if (Number.isFinite(v) && v >= 0) { digits = v ? String(v) : ''; fresh = false; show(); }
    });
    // Fallback for keyboards whose typing can't be intercepted: rebuild from whatever digits are there
    el.addEventListener('input', () => {
      const raw = el.value.replace(/\D/g, '').replace(/^0+/, '').slice(0, 9);
      if (fmtDigits(raw) === el.value) return;
      digits = raw; fresh = false; show();
    });
  }
  // An amount worth a second look: over ten times what was planned, or £1,000+ with nothing planned
  const looksLarge = (amount, planned) => planned > 0 ? amount > planned * 10 : amount >= 100000;
  const store = { get(k, d) { try { const v = localStorage.getItem('ep:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
                  set(k, v) { try { localStorage.setItem('ep:' + k, JSON.stringify(v)); } catch {} } };
  const $ = id => document.getElementById(id);
  const ICON_CHEV = '<svg class="chev" width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="m4 6 4 4 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const ICON_X = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="m4 4 8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
  const ICON_TICK = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="m3.5 8.5 3 3 6-6.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const ICON_BACK = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3 5 8l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const ICON_PEN = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10.5 3.5l2 2L6 12H4v-2l6.5-6.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>';
  const isPhone = () => window.matchMedia('(max-width: 860px)').matches;
  const ICON_BIN = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.5h5.8l.6-8.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const colorVar = c => 'var(--g-' + (c || 'slate') + ')';
  const sum = (arr, f) => arr.reduce((a, x) => a + f(x), 0);

  // ---------- state ----------
  const S = {

  // ---------- render all ----------
  function render() {
    renderHeader();
    const p = period();
    if (!p) return;
    $('stateScreen').hidden = true; $('app').hidden = false; $('tabbar').hidden = false;
    const c = compute(p);
    renderLedger(c); renderSide(c);
    if (S.open && S.open.mode === 'line') renderDrawer(false);
  }
  function showState(title, text) {
    $('stateScreen').innerHTML = `<h2>${esc(title)}</h2><p>${esc(text)}</p>`;
    $('stateScreen').hidden = false; $('app').hidden = true; $('tabbar').hidden = true;
  }

  // ---------- inline editing ----------
  function endEdit() { S.editing = false; if (S.ledgerStale) render(); }
  function startPlanEdit(lineId) {
    const p = period(); const f = findLine(p, lineId); if (!f) return;
    const btn = document.querySelector(`.row[data-line="${CSS.escape(lineId)}"] .l-plan`); if (!btn) return;
    S.editing = true;
    const inp = document.createElement('input');
    inp.className = 'inline-in l-plan-in num'; inp.value = (f.l.planned / 100).toFixed(2); inp.setAttribute('aria-label', 'Planned for ' + f.l.name);
    moneyInput(inp);
    btn.replaceWith(inp); inp.focus();
    let done = false;
    const finish = save => {
      if (done) return; done = true;
      const v = toPence(inp.value || '0');
      if (save && Number.isFinite(v) && v >= 0 && v !== f.l.planned) {
        const was = f.l.planned, groups = structuredClone(p.groups);
        for (const g of groups) for (const l of g.lines) if (l.id === lineId) { l.planned = v; if (l.debtId) l.manual = true; delete l.premove; }
        S.editing = false; saveGroups(p, groups);
        if (was > 0 && looksLarge(v, was)) toast('Planned ' + money(v) + ' for ' + f.l.name + ' (was ' + money(was) + ')', 'Undo', () => {
          const g2 = structuredClone(p.groups); for (const g of g2) for (const l of g.lines) if (l.id === lineId) l.planned = was; saveGroups(p, g2);
        });
      } else { if (save && !(Number.isFinite(v) && v >= 0)) toast('Enter an amount like 19.99'); S.editing = false; render(); }
    };
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); finish(true); } if (e.key === 'Escape') { e.preventDefault(); finish(false); } });
    inp.addEventListener('blur', () => finish(true));
  }
  function startNameEdit(lineId) {
    const p = period(); const f = findLine(p, lineId); if (!f) return;
    const btn = document.querySelector(`.row[data-line="${CSS.escape(lineId)}"] .l-name`); if (!btn) return;
    S.editing = true;
    const inp = document.createElement('input');
    inp.className = 'inline-in l-name-in'; inp.value = f.l.name; inp.autocomplete = 'off'; inp.setAttribute('aria-label', 'Name');
    btn.replaceWith(inp); inp.focus(); inp.select();
    let done = false;
    const finish = async save => {
      if (done) return; done = true;
      const name = inp.value.trim();
      S.editing = false;
      if (!save || !name || name === f.l.name) { render(); return; }
      const groups = structuredClone(p.groups);
      for (const g of groups) for (const l of g.lines) if (l.id === lineId) l.name = name;
      const d = f.l.debtId && S.debts[f.l.debtId];
      if (d) { const { id, ...body } = d; try { await tracked(() => S.db.doc('debts/' + id).set({ ...body, name })); } catch {} }
      saveGroups(p, groups);
    };
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); finish(true); } if (e.key === 'Escape') { e.preventDefault(); finish(false); } });
    inp.addEventListener('blur', () => finish(true));
  }
  function startAdd(groupId) {
    const p = period(); const g = (p.groups || []).find(x => x.id === groupId); if (!g) return;
    const ul = document.querySelector(`.group[data-group="${CSS.escape(groupId)}"] .lines`); if (!ul) return;
    if (S.collapsed[groupId]) { S.collapsed[groupId] = false; store.set('collapsed', S.collapsed); document.querySelector(`.group[data-group="${CSS.escape(groupId)}"]`).classList.remove('collapsed'); }
    S.editing = true;
    const li = document.createElement('li'); li.className = 'row adding';
    const isDebt = g.kind === 'debt';
    li.innerHTML = `<div class="row-in">
      <input class="inline-in l-name-in" id="addName" placeholder="${isDebt ? 'Card or loan name' : 'Item name'}" autocomplete="off"${isDebt ? ' list="debtNames"' : ''}>
      <input class="inline-in l-plan-in num" id="addPlan" placeholder="£0.00" aria-label="Planned amount">
      <span class="l-val num muted">${isDebt ? '' : '£0.00'}</span></div>`;
    ul.appendChild(li);
    const nameIn = li.querySelector('#addName'), planIn = li.querySelector('#addPlan');
    moneyInput(planIn);
    nameIn.focus();
    let done = false;
    const finish = async save => {
      if (done) return; done = true;
      const name = nameIn.value.trim(), planned = toPence(planIn.value || '0');
      if (!save || !name) { S.editing = false; render(); return; }
      if (!Number.isFinite(planned) || planned < 0) { toast('Enter an amount like 19.99'); S.editing = false; render(); return; }
      const line = { id: 'l-' + uid(), name, planned };
      let newDebt = null;
      if (isDebt) {
        const existing = Object.values(S.debts).find(d => d.name.trim().toLowerCase() === name.toLowerCase());
        if (existing) line.debtId = existing.id;
        else { newDebt = { id: 'd-' + uid(), name, opening: null }; line.debtId = newDebt.id; }
      }
      const groups = structuredClone(p.groups); groups.find(x => x.id === groupId).lines.push(line);
      S.editing = false;
      if (newDebt) { S.debts[newDebt.id] = newDebt; try { await tracked(() => S.db.doc('debts/' + newDebt.id).set({ name: newDebt.name, opening: null })); } catch (e) { toast(errText(e)); } }
      await saveGroups(p, groups);
      if (newDebt) openDrawer({ mode: 'line', lineId: line.id, edit: 'edOpen' });
    };
    li.addEventListener('keydown', e => {
      if (e.key === 'Escape') { e.preventDefault(); finish(false); }
      if (e.key === 'Enter') { e.preventDefault(); if (e.target === nameIn) planIn.focus(); else finish(true); }
    });
    li.addEventListener('focusout', () => setTimeout(() => { if (!li.contains(document.activeElement)) finish(true); }, 0));
  }

  // ---------- delete with undo ----------
  // Over budget: raise the main income line by the shortfall so the budget balances (with Undo)
  async function matchIncome() {
    const p = period(), c = compute(p), short = -c.toBudget; if (!(short > 0)) return;
    const before = structuredClone(p.groups), groups = structuredClone(p.groups);
    const lines = groups.filter(g => g.kind === 'income').flatMap(g => g.lines || []);
    if (!lines.length) { toast('Add an income line first'); return; }
    const main = lines.reduce((a, b) => (b.planned > a.planned ? b : a));
    main.planned += short;
    await saveGroups(p, groups);
    toast(main.name + ' raised by ' + money(short), 'Undo', () => saveGroups(p, before));
  }
  async function addReminderLine(remId) {
    const r = S.reminders.find(x => x.id === remId), p = S.periods.find(x => x.id === S.open.review);
    if (!r || !p) return;
    const amt = toPence($('ra-' + remId).value || '0'), gid = $('rg-' + remId).value;
    if (!Number.isFinite(amt) || amt < 0) { toast('Enter an amount like 60.00'); return; }
    const groups = structuredClone(p.groups || []), g = groups.find(x => x.id === gid); if (!g) return;
    const land = remLanding(r, p), line = { id: 'l-' + uid(), name: r.name, planned: amt };
    if (r.day && land) line.due = land;
    g.lines.push(line);
    await saveGroups(p, groups);
    await setRemState(p, remId, 'added');
    // The amount used this year becomes next year's starting figure
    if (amt !== r.amount) { r.amount = amt; try { await tracked(() => S.db.doc('reminders/' + remId).update({ amount: amt })); } catch (e) { toast(errText(e)); } }
    toast('Added ' + r.name + ' · ' + money(amt) + ' to ' + g.name);
  }
  async function deleteReminder(remId) {
    const r = S.reminders.find(x => x.id === remId); if (!r) return;
    const { id, ...body } = r;
    try { await tracked(() => S.db.doc('reminders/' + remId).delete()); } catch (e) { toast(errText(e)); return; }
    closeEditPage();
    toast('Deleted ' + r.name, 'Undo', async () => { try { await tracked(() => S.db.doc('reminders/' + id).set(body)); } catch (e) { toast(errText(e)); } });
  }
  // Delete a whole group (and its items and their transactions in this budget), with Undo
  async function deleteGroup(groupId) {
    const p = period(); const before = structuredClone(p.groups || []);
    const g = before.find(x => x.id === groupId); if (!g) return;
    const ids = new Set((g.lines || []).map(l => l.id));
    const txs = S.txns.filter(t => ids.has(t.lineId)).map(t => ({ col: 'budgets/' + p.id + '/txns', t }))
      .concat(S.debtTx.filter(t => t.periodId === p.id && ids.has(t.lineId)).map(t => ({ col: 'debtTx', t })));
    const debtIds = (g.lines || []).map(l => l.debtId).filter(Boolean);
    if (debtIds.length) p.skipDebts = [...new Set([...(p.skipDebts || []), ...debtIds])];
    closeDrawer();
    await saveGroups(p, before.filter(x => x.id !== groupId));
    for (const { col, t } of txs) { try { await tracked(() => S.db.doc(col + '/' + t.id).delete()); } catch {} }
    toast('Deleted ' + g.name, 'Undo', async () => {
      if (debtIds.length) p.skipDebts = (p.skipDebts || []).filter(x => !debtIds.includes(x));
      await saveGroups(p, before);
      for (const { col, t } of txs) { const { id, ...body } = t; try { await tracked(() => S.db.doc(col + '/' + id).set(body)); } catch {} }
    });
  }
  async function deleteLine(lineId) {
    const p = period(); const groups = structuredClone(p.groups);
    let removed = null, gid = null, idx = -1;
    for (const g of groups) { const k = g.lines.findIndex(l => l.id === lineId); if (k >= 0) { removed = g.lines[k]; gid = g.id; idx = k; g.lines.splice(k, 1); } }
    if (!removed) return;
    if (removed.debtId) p.skipDebts = [...(p.skipDebts || []), removed.debtId];
    const isDebt = !!removed.debtId;
    const txs = isDebt ? S.debtTx.filter(t => t.periodId === p.id && t.lineId === lineId) : S.txns.filter(t => t.lineId === lineId);
    const col = isDebt ? 'debtTx' : 'budgets/' + p.id + '/txns';
    if (S.open && S.open.lineId === lineId) closeDrawer();
    await saveGroups(p, groups);
    for (const t of txs) { try { await tracked(() => S.db.doc(col + '/' + t.id).delete()); } catch {} }
    toast('Deleted ' + removed.name + (txs.length ? ' and ' + txs.length + ' transaction' + (txs.length === 1 ? '' : 's') : ''), 'Undo', async () => {
      const g2 = structuredClone(p.groups); const tg = g2.find(g => g.id === gid); if (!tg) return;
      tg.lines.splice(Math.min(idx, tg.lines.length), 0, removed);
      if (removed.debtId) p.skipDebts = (p.skipDebts || []).filter(x => x !== removed.debtId);
      await saveGroups(p, g2);
      for (const t of txs) { const { id, ...body } = t; try { await tracked(() => S.db.doc(col + '/' + id).set(body)); } catch {} }
    });
  }

    return { start: toISO(s), end: toISO(end), id: toISO(end).slice(0, 7), label: MONTH_NAMES[end.getMonth()] + ' ' + end.getFullYear() };
  }
  async function planNext() {

    const n = nextPeriodDates(last);

    // Copy forward using each line's plan from before any money was moved in that budget
    const groups = structuredClone(last.groups || []).map(g => ({ ...g, lines: (g.lines || []).map(l => {
      const x = { ...l }; if (x.due) x.due = addMonthsISO(x.due, 1);

    if (!S.periods.some(p => p.id === n.id)) { S.periods.push(fromDoc(n.id, body)); S.periods.sort((a, b) => a.start.localeCompare(b.start)); }

    const t = todayISO();
    for (const p of S.periods) {
      if (!(t < p.start)) continue;
      const groups = structuredClone(p.groups || []);
      let dg = groups.find(g => g.kind === 'debt');
      if (!dg) { dg = { id: 'debt', name: 'Debt', kind: 'debt', color: 'purple', lines: [] }; groups.push(dg); }
      const skip = new Set(p.skipDebts || []);
      for (const d of Object.values(S.debts)) {
        if (skip.has(d.id) || groups.some(g => (g.lines || []).some(l => l.debtId === d.id))) continue;
        if (Number.isFinite(d.opening) && debtBalance(d.id, null, p.start) >= 0) continue; // nothing owed by then
        dg.lines.push({ id: 'l-' + uid(), name: d.name, planned: 0, debtId: d.id });

      const ok = await addTx(lineId, { amount: $('txAmt').value, date: $('txDate').value, payee: $('txPayee').value,
        refund: $('txRefund') ? $('txRefund').checked : false, type: $('txType') ? $('txType').value : 'pay' });
      if (ok) { if (document.activeElement) document.activeElement.blur(); closeDrawer(); }
    }
    if (e.target.id === 'remForm') {
      const name = $('rmName').value.trim(), month = +$('rmMonth').value, dayRaw = $('rmDay').value.trim(), amount = toPence($('rmAmt').value || '0'), group = $('rmGroup').value.trim() || 'Joint Account', err = $('rmErr');
      const day = dayRaw ? parseInt(dayRaw, 10) : null;
      if (!name) { err.textContent = 'Give the reminder a name.'; err.hidden = false; return; }
      if (day !== null && !(day >= 1 && day <= 31)) { err.textContent = 'Enter a day from 1 to 31, or leave it blank.'; err.hidden = false; return; }
      if (!Number.isFinite(amount) || amount < 0) { err.textContent = 'Enter an amount like 60.00.'; err.hidden = false; return; }
      const id = S.open.remId || ('r-' + uid());
      const old = S.reminders.find(x => x.id === id);
      const body = { name, month, day, amount, group, order: old ? (old.order || 0) : Date.now() };
      try { await tracked(() => S.db.doc('reminders/' + id).set(body)); } catch (er) { toast(errText(er)); return; }
      if (!old) S.reminders.push({ id, ...body }); else Object.assign(old, body);
      toast('Saved'); closeEditPage();
      return;
    }
    if (e.target.id === 'groupForm') {
      const name = $('grName').value.trim(), err = $('grErr'), p = period();
      if (!name) { err.textContent = 'Give the bucket a name.'; err.hidden = false; return; }
      const groups = structuredClone(p.groups || []);
      if (S.open.groupId) { const g = groups.find(x => x.id === S.open.groupId); if (g) g.name = name; }
      else {
        const used = new Set(groups.map(g => g.color)), pal = ['blue', 'red', 'amber', 'green', 'purple', 'slate'];
        const color = pal.find(c => !used.has(c)) || pal[groups.length % pal.length];
        // New groups go above Debt and Savings so spending groups stay together
        const at = groups.findIndex(g => g.kind === 'debt' || /saving/i.test(g.name));
        const ng = { id: 'g-' + uid(), name, kind: 'expense', color, lines: [] };
        if (at >= 0) groups.splice(at, 0, ng); else groups.push(ng);
      }
      closeDrawer(); await saveGroups(p, groups); toast(S.open ? 'Saved' : (name + ' saved'));
      return;
    }
    if (e.target.id === 'moveForm') {
      const { p, from, to } = moveEnds(), amt = toPence($('mvAmt').value || '0'), err = $('mvErr');
      if (!from || !to) { err.textContent = 'Pick a line to move money with.'; err.hidden = false; return; }
      if (!(amt > 0)) { err.textContent = 'Enter an amount to move.'; err.hidden = false; return; }
      if (amt > Math.max(from.left, 0)) { err.textContent = 'Only ' + money(Math.max(from.left, 0)) + ' is left on ' + from.name + '.'; err.hidden = false; return; }
      err.hidden = true;
      const before = structuredClone(p.groups), groups = structuredClone(p.groups);
      for (const g of groups) for (const l of g.lines) {
        // Start from the amounts shown (debt lines in future budgets may show an automatic figure)
        // Remember each line's plan from before any moves, so the next budget starts from that
        const shift = (newPlan) => {
          if (!l.premove) l.premove = { planned: l.planned, manual: !!l.manual };
          l.planned = newPlan; if (l.debtId) l.manual = true;
          if (l.planned === l.premove.planned) { if (!l.premove.manual) delete l.manual; delete l.premove; }
        };
        if (l.id === from.id) shift(from.planned - amt);
        if (l.id === to.id) shift(to.planned + amt);
      }
      await saveGroups(p, groups);
      toast('Moved ' + money(amt) + ' from ' + from.name + ' to ' + to.name, 'Undo', () => saveGroups(p, before));
      S.open.edit = null; renderDrawer(true);
      return;
    }
    if (e.target.id === 'editForm') {
      const name = $('edName').value.trim(), planned = toPence($('edPlan').value || '0'), due = $('edDue').value, dd = $('edDD').checked, err = $('edErr');
      if (!name) { err.textContent = 'Give the item a name.'; err.hidden = false; return; }
      if (!Number.isFinite(planned) || planned < 0) { err.textContent = 'Enter a planned amount of £0 or more, like 19.99.'; err.hidden = false; return; }
      const p = period(), groups = structuredClone(p.groups); let debtId = null;
      for (const g of groups) for (const l of g.lines) if (l.id === S.open.lineId) {
        if (planned !== l.planned) delete l.premove;
        l.name = name; l.planned = planned; if (due) l.due = due; else delete l.due; if (dd) l.dd = true; else delete l.dd; debtId = l.debtId || null;
        if (l.debtId && $('edAuto')) { if ($('edAuto').checked) delete l.manual; else l.manual = true; }
      }
      if (debtId && $('edOpen')) {
        const raw = $('edOpen').value.trim(); const v = raw === '' ? null : toPence(raw);
        if (v !== null && !Number.isFinite(v)) { err.textContent = 'Enter the balance owed, like 1000.'; err.hidden = false; return; }
        const opening = v === null ? null : -Math.abs(v);
        const aprRaw = $('edApr').value.trim(), apr = aprRaw === '' ? null : parseFloat(aprRaw.replace('%', ''));
        if (apr !== null && !(Number.isFinite(apr) && apr >= 0)) { err.textContent = 'Enter the interest rate as a number, like 0 or 24.9.'; err.hidden = false; return; }
        const promoEnd = $('edPromo').value || null;
        const body = { name, opening, apr, promoEnd };
        try { await tracked(() => S.db.doc('debts/' + debtId).set(body)); S.debts[debtId] = { id: debtId, ...body }; } catch (er) { toast(errText(er)); return; }
      }
      S.open.edit = null;
      const was = (findLine(p, S.open.lineId) || {}).l?.planned ?? 0, lineId = S.open.lineId;
      const toBucket = $('edBucket') ? $('edBucket').value : null;
      const moved = toBucket ? moveLineIn(groups, lineId, toBucket) : false;
      await saveGroups(p, groups);
      if (moved) {
        // Carry the move into budgets already planned after this one (past budgets keep their history)
        let also = 0;
        for (const q of S.periods.filter(q => q.start > p.start && !q.archive)) {
          const gq = structuredClone(q.groups || []);
          if (moveLineIn(gq, lineId, toBucket)) { await saveGroups(q, gq); also++; }
        }
        const dst = groups.find(g => g.id === toBucket);
        toast('Moved ' + name + ' to ' + dst.name + (also ? ' (and ' + also + ' later budget' + (also === 1 ? '' : 's') + ')' : ''));
      }
      else if (was > 0 && planned !== was && looksLarge(planned, was)) toast('Planned ' + money(planned) + ' for ' + name + ' (was ' + money(was) + ')', 'Undo', () => {
        const g2 = structuredClone(p.groups); for (const g of g2) for (const l of g.lines) if (l.id === lineId) l.planned = was; saveGroups(p, g2);
      });
      else toast('Saved');
      if (S.open && S.open.page === 'edit') closeEditPage(); else renderDrawer(true);
    }
  });

  // ---------- boot ----------
  async function boot(db) {
    S.db = db;
    let settled = false;
    const timer = setTimeout(() => { if (!settled) showState("Can't reach your budget yet", 'Check your connection. This page keeps trying in the background.'); }, 10000);
    db.collection('debts').onSnapshot(snap => { S.debts = Object.fromEntries(snap.docs.map(d => [d.id, { id: d.id, ...d.data() }])); if (!snap.metadata.fromCache) S.debtsLoaded = true; render(); scheduleSync(); }, () => {});
    db.collection('reminders').onSnapshot(snap => { S.reminders = snap.docs.map(d => ({ id: d.id, ...d.data() })); render(); if (S.open && S.open.mode === 'reminders' && S.open.page !== 'edit') renderDrawer(true); }, () => {});
    db.collection('remState').onSnapshot(snap => { S.remState = Object.fromEntries(snap.docs.map(d => [d.id, d.data()])); render(); }, () => {});
    db.collection('debtTx').onSnapshot(snap => { S.debtTx = snap.docs.map(d => ({ id: d.id, ...d.data() })); if (!snap.metadata.fromCache) S.debtTxLoaded = true; render(); scheduleSync(); }, () => {});
    db.collection('budgets').onSnapshot(snap => {
      S.periods = snap.docs.map(d => fromDoc(d.id, d.data())).filter(p => p.start && p.end).sort((a, b) => a.start.localeCompare(b.start));
      if (!snap.metadata.fromCache) { settled = true; clearTimeout(timer); }
      if (!S.periods.length) { if (!snap.metadata.fromCache) { showState('No budgets yet', 'Bring your budgets across from a backup file to get started.'); if (window.EP_EMPTY) window.EP_EMPTY(); } return; }
      if (!period()) {
        const t = todayISO(); const cur = S.periods.find(p => t >= p.start && t <= p.end) || S.periods[S.periods.length - 1];
        selectPeriod(cur.id);
      } else render();
      scheduleSync();
    }, () => { settled = true; clearTimeout(timer); showState("Can't reach your budget", 'Reopen this page to try again.'); });
  }
  window.EP = { boot, showState, toast, render };
})();
</script>
<script type="module" src="app.js"></script>
</body>
</html>
